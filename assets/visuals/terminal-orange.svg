<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
    <defs>
        <!-- Efek Garis Retro Terminal (Scanlines) -->
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="2" fill="#000000" opacity="0.15" />
        </pattern>
        <!-- Glow Sederhana untuk Kursor -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        /* TEMA ORANYE RETRO */
        .bg { fill: #120A04; stroke: #E67E22; stroke-width: 2; rx: 8px; }
        .top-bar { fill: #E67E22; opacity: 0.15; }
        .title { fill: #E67E22; font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
        .prompt { fill: #E67E22; font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; }
        .text { fill: #FAD7A1; font-family: 'Courier New', Courier, monospace; font-size: 15px; text-shadow: 0px 0px 2px rgba(230, 126, 34, 0.4); }
        
        /* ANIMASI KURSOR */
        .blink { animation: blinker 1s step-start infinite; fill: #E67E22; filter: url(#glow); }
        @keyframes blinker { 50% { opacity: 0; } }

        /* ANIMASI EFEK MENGETIK */
        .typing-mask { fill: #120A04; }
        @keyframes typeReveal {
            0% { transform: translateX(0); }
            100% { transform: translateX(550px); }
        }
        .mask1 { animation: typeReveal 1.2s steps(40, end) 0.5s forwards; }
        .mask2 { animation: typeReveal 1.2s steps(40, end) 2.0s forwards; }
        .mask3 { animation: typeReveal 1.2s steps(40, end) 3.5s forwards; }
        .mask4 { animation: typeReveal 1.2s steps(40, end) 5.0s forwards; }

        /* ========================================= */
        /* ANIMASI KUCING OREN MENGGEMASKAN          */
        /* ========================================= */
        
        /* Tangan Melambai */
        .wave-arm { transform-origin: 25px 77px; animation: wave 1.5s ease-in-out infinite; }
        @keyframes wave {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(-35deg); }
        }

        /* Ekor Goyang Santai */
        .tail-wag { transform-origin: 5px 95px; animation: wag 2s ease-in-out infinite; }
        @keyframes wag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }

        /* Hati Melayang (Floating Heart) */
        .heart { animation: floatHeart 2.5s ease-in infinite; opacity: 0; }
        @keyframes floatHeart {
            0% { transform: translateY(10px) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
        }
    </style>

    <!-- Background Terminal -->
    <rect x="0" y="0" width="800" height="280" class="bg" />
    <rect x="0" y="0" width="800" height="35" class="top-bar" rx="8" />
    <path d="M 0 35 L 800 35" stroke="#E67E22" stroke-width="1" />
    
    <!-- Tombol Mac Window -->
    <circle cx="20" cy="17.5" r="6" fill="#FF5F56" />
    <circle cx="40" cy="17.5" r="6" fill="#FFBD2E" />
    <circle cx="60" cy="17.5" r="6" fill="#27C93F" />
    <text x="400" y="22" class="title">Asobirin29@kucing_os:~</text>

    <!-- Lapisan Scanline Retro CRT -->
    <rect x="0" y="36" width="800" height="244" fill="url(#scanlines)" pointer-events="none" />

    <!-- ========================================== -->
    <!-- PIXEL KUCING OREN (DIBUAT MURNI PAKAI SVG) -->
    <!-- ========================================== -->
    <g transform="translate(45, 80)">
        
        <!-- Bayangan Kucing -->
        <rect x="0" y="145" width="110" height="12" fill="#000000" opacity="0.4" rx="6" />

        <!-- Ekor Bergoyang -->
        <g class="tail-wag">
            <rect x="0" y="90" width="20" height="12" fill="#E67E22" />
            <rect x="-10" y="65" width="12" height="35" fill="#E67E22" />
            <rect x="-10" y="55" width="12" height="10" fill="#FFFFFF" /> <!-- Ujung Ekor Putih -->
        </g>

        <!-- Badan -->
        <rect x="25" y="70" width="60" height="75" fill="#E67E22" />
        <!-- Perut Putih -->
        <rect x="35" y="85" width="40" height="60" fill="#FFFFFF" />
        
        <!-- Belang Badan -->
        <rect x="25" y="80" width="10" height="8" fill="#D35400" />
        <rect x="75" y="80" width="10" height="8" fill="#D35400" />
        <rect x="25" y="100" width="10" height="8" fill="#D35400" />
        <rect x="75" y="100" width="10" height="8" fill="#D35400" />

        <!-- Kaki Kanan (Duduk Manis) -->
        <rect x="65" y="135" width="25" height="12" fill="#FFFFFF" />

        <!-- Kepala & Telinga -->
        <rect x="15" y="10" width="20" height="20" fill="#D35400" />
        <rect x="20" y="15" width="10" height="15" fill="#FF9999" />
        <rect x="75" y="10" width="20" height="20" fill="#D35400" />
        <rect x="80" y="15" width="10" height="15" fill="#FF9999" />
        
        <rect x="10" y="25" width="90" height="55" fill="#E67E22" />
        
        <!-- Belang Kepala -->
        <rect x="42" y="25" width="7" height="15" fill="#D35400" />
        <rect x="52" y="25" width="7" height="15" fill="#D35400" />
        <rect x="62" y="25" width="7" height="15" fill="#D35400" />

        <!-- Pipi Bawah Putih -->
        <rect x="15" y="55" width="80" height="25" fill="#FFFFFF" />

        <!-- Mata Bahagia (^ ^) -->
        <rect x="25" y="45" width="6" height="6" fill="#111111" />
        <rect x="31" y="40" width="6" height="6" fill="#111111" />
        <rect x="37" y="45" width="6" height="6" fill="#111111" />
        
        <rect x="67" y="45" width="6" height="6" fill="#111111" />
        <rect x="73" y="40" width="6" height="6" fill="#111111" />
        <rect x="79" y="45" width="6" height="6" fill="#111111" />

        <!-- Hidung & Mulut Senyum -->
        <rect x="52" y="55" width="6" height="4" fill="#FF9999" />
        <rect x="46" y="60" width="6" height="5" fill="#111111" />
        <rect x="58" y="60" width="6" height="5" fill="#111111" />
        <rect x="52" y="65" width="6" height="5" fill="#111111" />

        <!-- Tangan Kiri Melambai (Animasi) -->
        <g class="wave-arm">
            <rect x="-10" y="70" width="35" height="15" fill="#E67E22" />
            <rect x="-15" y="70" width="15" height="15" fill="#FFFFFF" />
            <!-- Pink Beans (Telapak Tangan) -->
            <rect x="-12" y="72" width="4" height="4" fill="#FF9999" />
            <rect x="-12" y="78" width="4" height="4" fill="#FF9999" />
        </g>

        <!-- Hati Melayang -->
        <g class="heart">
            <path d="M -15 30 A 6 6 0 0 1 -3 30 A 6 6 0 0 1 9 30 Q 9 40 -3 50 Q -15 40 -15 30 Z" fill="#E74C3C" />
        </g>

    </g>

    <!-- ========================================== -->
    <!-- TEKS TERMINAL MENGETIK                     -->
    <!-- ========================================== -->
    <g transform="translate(190, 85)">
        <text x="0" y="0" class="prompt">&gt; ./summon_kitty.sh</text>
        
        <!-- Teks Output Terminal -->
        <text x="0" y="35" class="text">[OK] Feline matrix loaded successfully.</text>
        <text x="0" y="65" class="text">Nyaw! Hello there, human! ✨</text>
        <text x="0" y="95" class="text">Welcome to Asobirin's workspace.</text>
        <text x="0" y="125" class="text">Eat. Sleep. Code. Purr. Repeat.</text>

        <!-- Kotak Penutup untuk Efek Mengetik (Reveal) -->
        <rect x="0" y="20" width="550" height="20" class="typing-mask mask1" />
        <rect x="0" y="50" width="550" height="20" class="typing-mask mask2" />
        <rect x="0" y="80" width="550" height="20" class="typing-mask mask3" />
        <rect x="0" y="110" width="550" height="20" class="typing-mask mask4" />

        <!-- Kursor Berkedip -->
        <text x="0" y="165" class="prompt">&gt; <tspan class="blink">_</tspan></text>
    </g>
</svg>
