<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60">
  <defs>
    <style>
      .bg { fill: #062319; fill-opacity: 0.1; }
      .pacman { fill: #facc15; }
      .ghost-body { fill: #f43f5e; }
      .ghost-eyes { fill: #ffffff; }
      .ghost-pupil { fill: #1e3a8a; }
      .dot { fill: #fbbf24; }
      .text { font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: undefined; font-weight: bold; }
    </style>
  </defs>
  
  <rect width="800" height="60" rx="10" class="bg" />
  <text x="15" y="35" class="text">L I F E : ❤️ ❤️ ❤️</text>
  <text x="650" y="35" class="text">S C O R E : 9999</text>

  <!-- Dots -->
  <g>
    <circle cx="300" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="0.00s" repeatCount="indefinite" />
    </circle>
    <circle cx="330" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="0.27s" repeatCount="indefinite" />
    </circle>
    <circle cx="360" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="0.53s" repeatCount="indefinite" />
    </circle>
    <circle cx="390" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="0.80s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="1.07s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="1.33s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="1.60s" repeatCount="indefinite" />
    </circle>
    <circle cx="510" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="1.87s" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="2.13s" repeatCount="indefinite" />
    </circle>
    <circle cx="570" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="2.40s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="2.67s" repeatCount="indefinite" />
    </circle>
    <circle cx="630" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="2.93s" repeatCount="indefinite" />
    </circle>
    <circle cx="660" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="3.20s" repeatCount="indefinite" />
    </circle>
    <circle cx="690" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="3.47s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="30" r="4" class="dot">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="4s" begin="3.73s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pacman Group moving right -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="250,0; 550,0; 250,0" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
    
    <!-- Pacman SVG -->
    <path class="pacman" d="M 30,30 L 50,15 A 25,25 0 1,1 50,45 Z">
      <animate attributeName="d" values="M 30,30 L 50,15 A 25,25 0 1,1 50,45 Z; M 30,30 L 55,30 A 25,25 0 1,1 55,30 Z; M 30,30 L 50,15 A 25,25 0 1,1 50,45 Z" dur="0.4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="1,1; -1,1; 1,1" keyTimes="0;0.499;1" dur="8s" additive="sum" repeatCount="indefinite" />
    </path>
    
    <!-- Ghost -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-70,0; -70,0; 70,0" keyTimes="0;0.499;1" dur="8s" repeatCount="indefinite" />
      
      <path class="ghost-body" d="M 30,45 L 30,25 A 15,15 0 0,1 60,25 L 60,45 L 55,40 L 50,45 L 45,40 L 40,45 L 35,40 Z">
        <animateTransform attributeName="transform" type="translate" values="0,-2; 0,2; 0,-2" dur="0.5s" repeatCount="indefinite" />
      </path>
      <!-- Eyes -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,-2; 0,2; 0,-2" dur="0.5s" repeatCount="indefinite" />
        <circle cx="40" cy="22" r="4" class="ghost-eyes" />
        <circle cx="50" cy="22" r="4" class="ghost-eyes" />
        <circle cx="42" cy="22" r="1.5" class="ghost-pupil">
          <animate attributeName="cx" values="40;44;40" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="52" cy="22" r="1.5" class="ghost-pupil">
          <animate attributeName="cx" values="50;54;50" dur="2s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>
</svg>