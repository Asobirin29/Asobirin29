<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 440 375" role="img">
  <defs>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#84CC16" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="radar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .radar-bg { fill: #062319; fill-opacity: 0.45; stroke: #F59E0B; stroke-opacity: 0.25; stroke-width: 1.5; rx: 12px; }
    .grid-line { fill: none; stroke: #6EE7B7; stroke-opacity: 0.3; stroke-width: 0.8; }
    .skill-poly { fill: url(#radar-glow); stroke: #10B981; stroke-width: 2.2; filter: url(#radar-shadow); opacity: 0.88; }
    .skill-poly-outline { fill: none; stroke: #84CC16; stroke-width: 1; opacity: 0.6; }
    .label-text { font-family: 'Courier New', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #ECFDF5; }
    .radar-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #10B981; letter-spacing: 1.5px; }
  </style>
  
  <rect x="2" y="2" width="436" height="371" class="radar-bg" />
  <text x="20" y="25" class="radar-title">SKILLS.RADAR.MAP</text>
  
  <g>
    <!-- Background grid -->
    <polygon points="220.0,177.5 243.8,191.3 243.8,218.8 220.0,232.5 196.2,218.8 196.2,191.3" class="grid-line" />
    <polygon points="220.0,150.0 267.6,177.5 267.6,232.5 220.0,260.0 172.4,232.5 172.4,177.5" class="grid-line" />
    <polygon points="220.0,122.5 291.4,163.8 291.4,246.3 220.0,287.5 148.6,246.3 148.6,163.8" class="grid-line" />
    <polygon points="220.0,95.0 315.3,150.0 315.3,260.0 220.0,315.0 124.7,260.0 124.7,150.0" class="grid-line" />
    <line x1="220" y1="205" x2="220.0" y2="95.0" class="grid-line" />
    <line x1="220" y1="205" x2="315.3" y2="150.0" class="grid-line" />
    <line x1="220" y1="205" x2="315.3" y2="260.0" class="grid-line" />
    <line x1="220" y1="205" x2="220.0" y2="315.0" class="grid-line" />
    <line x1="220" y1="205" x2="124.7" y2="260.0" class="grid-line" />
    <line x1="220" y1="205" x2="124.7" y2="150.0" class="grid-line" />
    
    <!-- Skill Area Polygon -->
    <polygon points="220.0,117.0 305.7,155.5 301.0,251.8 220.0,298.5 148.6,246.3 143.8,161.0" class="skill-poly">
      <animate attributeName="opacity" values="0.88;0.65;0.88" dur="4s" repeatCount="indefinite" />
    </polygon>
    <polygon points="220.0,117.0 305.7,155.5 301.0,251.8 220.0,298.5 148.6,246.3 143.8,161.0" class="skill-poly-outline" />
    
    <!-- Labels -->
    <text x="220.0" y="75.0" text-anchor="middle" class="label-text">PHP (80%)</text>
    <text x="336.0" y="142.0" text-anchor="start" class="label-text">JavaScript (90%)</text>
    <text x="336.0" y="276.0" text-anchor="start" class="label-text">Node.js (85%)</text>
    <text x="220.0" y="343.0" text-anchor="middle" class="label-text">TypeScript (85%)</text>
    <text x="104.0" y="276.0" text-anchor="end" class="label-text">Python (75%)</text>
    <text x="104.0" y="142.0" text-anchor="end" class="label-text">React (80%)</text>
  </g>
</svg>